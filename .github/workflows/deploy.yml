name: Inject secrets

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject Groq API key
        run: |
          sed -i 's|GROQ_API_KEY_PLACEHOLDER|${{ secrets.GROQ_API_KEY }}|g' search.html

      - name: Commit injected file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add search.html
          git diff --staged --quiet || git commit -m "Inject API keys [skip ci]"
          git push
